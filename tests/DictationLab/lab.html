<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dictation Lab</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 40px; background: #f6f8fa; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  textarea, input { width: 560px; font: inherit; padding: 8px; }
  textarea { height: 160px; }
</style>
</head>
<body>
<h1>Dictation Lab</h1>
<p>Test page for tests/DictationLab/run.ps1. Nothing here is sent anywhere.</p>
<label for="message">Message</label>
<textarea id="message" aria-label="Message" autofocus></textarea>
<label for="password">Password</label>
<input id="password" type="password" aria-label="Password">
<script>
  // The test window is brought to the front by run.ps1; put the cursor in the message box whenever it gets focus.
  const message = document.getElementById('message');
  const focusMessage = () => { if (document.activeElement !== document.getElementById('password')) message.focus(); };
  window.addEventListener('load', focusMessage);
  window.addEventListener('focus', focusMessage);
</script>
</body>
</html>
